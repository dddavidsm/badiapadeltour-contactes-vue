services:
  db:
    image: mysql:8.0
    container_name: bpt-db
    environment:
      MYSQL_DATABASE: badiapadeltour
      MYSQL_USER: bptuser
      MYSQL_PASSWORD: bptpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - bpt_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bpt-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:4173
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: badiapadeltour
      DB_USERNAME: bptuser
      DB_PASSWORD: bptpass
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    ports:
      - "8080:80"

  json-server:
    image: clue/json-server
    container_name: bpt-json-server
    volumes:
      - ./db.json:/data/db.json
    ports:
      - "3001:80"
    command: -H 0.0.0.0 /data/db.json

volumes:
  bpt_db_data:
